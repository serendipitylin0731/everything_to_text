name: Build Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35"
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          grep -F "versionName \"$version\"" android/app/build.gradle
      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          for value in "$KEYSTORE_BASE64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then echo '::error::Release signing secrets are incomplete.'; exit 1; fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shizi-release.p12"
          echo "SHIZI_KEYSTORE=$RUNNER_TEMP/shizi-release.p12" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          SHIZI_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SHIZI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SHIZI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$signer"
          report="$("$signer" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)"
          printf '%s\n' "$report"
          actual="$(printf '%s\n' "$report" | awk '/Signer #1 certificate SHA-256 digest/ {print $NF}' | tr '[:upper:]' '[:lower:]')"
          expected="$(tr -d '\r\n' < .github/release-signing-sha256.txt)"
          echo "Expected certificate SHA-256: $expected"
          if [ "$actual" != "$expected" ]; then echo '::error::APK signing certificate does not match the release identity.'; exit 1; fi
      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "shizi-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: shizi-android
          path: shizi-*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="拾字 ${GITHUB_REF_NAME} 安卓安装包。识别模型已随安装包提供。"
          gh release create "$GITHUB_REF_NAME" "shizi-${GITHUB_REF_NAME}.apk" --title "拾字 ${GITHUB_REF_NAME}" --notes "$notes"
